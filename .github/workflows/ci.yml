name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Cancel superseded runs. Each run re-tests everything, so a cancelled run
# never leaves a gap the next one doesn't cover.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Hosted CI uses Linux only. Native macOS checks, bindings, packaging and
# performance gates run locally through Git hooks and release verification.
jobs:
  # ---------------------------------------------------------------------------
  # Frontend: Biome, typecheck, Vitest and Playwright against the mock transport.
  # None of it needs macOS or the Rust build; the generated bindings are
  # committed. The Playwright perf gates are skipped here: their budgets are
  # macOS Chromium numbers, so the local pre-push hook runs them separately.
  # ---------------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Check shared agent guidance and synchronizer
        run: make agent-config-check agent-config-test agent-hooks-test verification-test

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      # After setup-bun so real node outranks ~/.bun/bin in PATH.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-linux-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-linux-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Architecture regression tests
        run: make architecture-test

      - name: bun run check
        run: bun run check

      - name: Production frontend build
        run: bun run build

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium webkit

      - name: Playwright Chromium
        run: bun run test:e2e --project chromium

      - name: Playwright WebKit (1/2)
        run: bun run test:e2e --project webkit --shard 1/2

      - name: Playwright WebKit (2/2)
        run: bun run test:e2e --project webkit --shard 2/2

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-linux
          path: playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Dependency audit: cargo-deny (deny.toml) and bun audit. Licenses, bans and
  # sources only change with our lockfiles, so they block. Advisories also change
  # when RustSec or npm publish one, which would fail unrelated PRs, so that
  # check is shown but does not fail the run. Ownership and response are documented
  # in .github/dependency-audits.md.
  # ---------------------------------------------------------------------------
  deny:
    name: deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Read pinned Rust version
        id: rust
        run: python3 -c 'import tomllib; print("version=" + tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])' >> "$GITHUB_OUTPUT"

      # Use the repository pin for cargo-deny's manifest parsing too.
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1 (cargo-deny 0.20.2)
        with:
          rust-version: ${{ steps.rust.outputs.version }}
          command: check ${{ matrix.checks }}

  audit-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Same reasoning as the advisories check above.
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      # Checks bun.lock against the npm advisory database.
      - name: bun audit
        run: bun audit

  # ---------------------------------------------------------------------------
  # The portable crates must build and pass on Linux (v4 agent). Native on
  # ubuntu rather than cross-compiled from macOS: bundled SQLite runs a C build
  # script that would need a cross compiler. src-tauri is not built here.
  # ---------------------------------------------------------------------------
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-linux-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-linux-

      # Remote trust tests exercise the real OpenSSH key fingerprinting command.
      - name: Install remote test prerequisites
        run: sudo apt-get update && sudo apt-get install --yes openssh-client

      - name: Architecture boundaries and regression tests
        run: make architecture-check

      - name: Portable crate checks and tests
        run: make rust-portable-check rust-portable-test

      # This bridge ships for macOS only; Linux compilation catches portability
      # regressions cheaply without claiming Linux product support.
      - name: Remote helper compile check
        run: cargo check -p kelvo-remote-helper --all-targets

      # The static Linux agents the app bundles (make agent-linux, D-116), built the way
      # the release builds them. Versions match ZIG_VERSION and CARGO_ZIGBUILD_VERSION in
      # the Makefile, which fails on a mismatch.
      - name: Install zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0

      - name: Install cargo-zigbuild
        run: |
          pipx install cargo-zigbuild==0.23.4
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Builds both musl targets, checks they are static and that aarch64 segments fit
      # 16K and 64K page kernels, and prints their digests.
      - name: Linux agent binaries
        run: make agent-linux

      - name: Linux agent smoke test
        run: src-tauri/binaries/agent/kelvo-agent-x86_64-unknown-linux-musl version --json

      # The stdio session and one-shot commands against the musl build of the agent.
      - name: Linux agent pipe test (musl)
        run: cargo-zigbuild test --locked -p kelvo-agent --test pipe --target x86_64-unknown-linux-musl

      # 30 days of synthetic history through the real store writer, pruned, then
      # measured: fails if 150 series exceed 150 MB, and logs the 250-series size.
      # Ignored in plain `cargo test` because it writes ~1 GB; see `make test-fill`.
      - name: Store fill test
        run: cargo test --release -p kelvo-store --test fill -- --ignored --nocapture
