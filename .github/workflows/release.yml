name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - name: Cache Rust dependencies and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-macos-26-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            release-macos-26-
            cargo-macos-26-
      - name: Install toolchain and dependencies
        run: |
          rustup show active-toolchain
          bun install --frozen-lockfile
          python3 scripts/release-manifest.py "$RELEASE_TAG"
          # Cached compilation can be reused; packaged assets must belong to this tag.
          rm -rf target/release/bundle target/release-assets
      # The bundled Linux agents (D-115). Versions match ZIG_VERSION and
      # CARGO_ZIGBUILD_VERSION in the Makefile, which fails on a mismatch, so the release
      # fails here rather than packaging an app without them.
      - name: Install zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - name: Install cargo-zigbuild
        run: |
          pipx install cargo-zigbuild==0.23.4
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build Linux agents
        run: make agent-linux
      - name: Check frontend and release manifest
        run: |
          bun run check
          python3 scripts/test-release-manifest.py
      - name: Build ad-hoc-signed app, DMG and signed updater archive
        env:
          APPLE_SIGNING_IDENTITY: '-'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Missing updater signing key'; exit 1; }
          bun run build:app --config src-tauri/tauri.release.conf.json --bundles app,dmg
      - name: Verify bundle and stage downloads
        run: |
          codesign --verify --deep --strict target/release/bundle/macos/Kelvo.app
          test -x target/release/bundle/macos/Kelvo.app/Contents/MacOS/kelvo-remote-helper
          for triple in aarch64-unknown-linux-musl x86_64-unknown-linux-musl; do
            cmp src-tauri/binaries/agent/kelvo-agent-$triple target/release/bundle/macos/Kelvo.app/Contents/Resources/agent/kelvo-agent-$triple
          done
          scripts/check-deps.sh target/release/bundle/macos/Kelvo.app/Contents/MacOS/kelvo target/release/bundle/macos/Kelvo.app/Contents/MacOS/kelvo-remote-helper
          python3 scripts/release-manifest.py "$RELEASE_TAG" --stage
          cargo run -p kelvo --example verify_release -- target/release-assets
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" target/release-assets/* --verify-tag --draft --title "Kelvo $RELEASE_TAG" --notes-file RELEASE_NOTES.md
