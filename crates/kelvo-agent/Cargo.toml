[package]
name = "kelvo-agent"
description = "Headless Kelvo agent: samples this host into its own history and serves it over SSH stdio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kelvo-engine.workspace = true
kelvo-proto.workspace = true
kelvo-remote.workspace = true
kelvo-schema.workspace = true
kelvo-store.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "io-util"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "std"] }
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["process"] }

[lints]
workspace = true
