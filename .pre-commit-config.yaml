# Install once per clone: `make hooks`, or
# `uvx pre-commit install --install-hooks -t pre-commit -t commit-msg -t pre-push`
# (or `pre-commit install ...` if pre-commit is on PATH).

# Without this, every hook with no `stages:` also runs at the commit-msg stage,
# so each commit ran the secret scans twice and printed the whole hook list
# twice. Only conventional-pre-commit opts into commit-msg.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # Binary protocol fixtures, captured /proc and /sys trees and upstream font
        # licenses are byte-preserved.
        exclude: '(^src/core/generated/|^src-tauri/fonts/|\.cbor$|/linux/fixtures/)'
      - id: end-of-file-fixer
        # Binary protocol fixtures, captured /proc and /sys trees and upstream font
        # licenses are byte-preserved.
        exclude: '(^src/core/generated/|^src-tauri/fonts/|\.cbor$|/linux/fixtures/)'
      - id: check-yaml
      - id: check-toml
      - id: check-json
        # tsconfig files are JSONC (comments allowed).
        exclude: ^tsconfig.*\.json$
      - id: check-added-large-files
        # Anything past 2 MB is an accident.
        args: [--maxkb=2048]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        # --verbose makes a failure print the allowed type list.
        args: [--verbose, feat, fix, docs, style, refactor, test, chore, ci, perf, build, revert]

  # Shared guidance stays derived from Claude sources. Check only: never rewrite
  # generated files during a commit. Include symlinks when selecting this hook.
  - repo: local
    hooks:
      - id: agent-config-sync
        name: Check shared agent config (run make agent-config)
        entry: python3 scripts/agent-config/sync.py --check
        language: system
        files: '^(CLAUDE\.md$|AGENTS\.md$|\.claude/(skills|rules|commands)/|\.agents/|scripts/agent-config/)'
        types: []
        pass_filenames: false

  # Frontend hooks (Biome, TypeScript). Biome formats, sorts imports and
  # Tailwind classes, and lints (including the boundary rules) in one pass;
  # biome.json's files.includes already skips src/core/generated/.
  - repo: local
    hooks:
      - id: frontend-biome
        name: frontend biome
        entry: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true
        language: system
        files: \.(ts|tsx|js|mjs|json|jsonc|css)$
        pass_filenames: true
        require_serial: true
      - id: frontend-typecheck
        name: frontend typecheck
        entry: bun run typecheck
        language: system
        files: ^((src|tests)/.*\.(ts|tsx)|tsconfig.*\.json|package\.json|bun\.lock|[a-z.]+\.config\.ts)$
        pass_filenames: false

  # Rust hooks, run against the root workspace. clippy is a whole-workspace
  # build, so it only fires when Rust or a manifest is staged. The dist/ stub is
  # what tauri::generate_context! needs to compile on a clean checkout.
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        files: \.rs$
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: bash -c 'mkdir -p dist && cargo clippy --workspace --all-targets -- -D warnings'
        language: system
        files: (\.rs|Cargo\.toml|Cargo\.lock|clippy\.toml)$
        pass_filenames: false

  # Native macOS verification stays local; hosted CI uses Linux only. The whole
  # `make check` (fmt, clippy, the appstore edition, cargo test with the engine
  # perf gates, Biome, typecheck, Vitest), the bindings freshness check and the
  # Playwright frontend perf gates, whose budgets are macOS numbers. Only
  # when the pushed commits touch code or manifests; docs-only pushes skip it.
  - repo: local
    hooks:
      - id: macos-check
        name: make check bindings-check e2e-perf (macOS)
        entry: bash scripts/pre-push-check.sh
        language: system
        stages: [pre-push]
        files: (\.(rs|ts|tsx|js|mjs|css|json|jsonc|toml|lock|html)$|^Makefile$|^clippy\.toml$|^perf-budget\.json$|^scripts/(pre-push-check\.sh$|verification/.*\.py$)|^\.pre-commit-config\.yaml$)
        pass_filenames: false
        require_serial: true
        verbose: true
